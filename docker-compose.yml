services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-nextjs-app:latest
    container_name: nextjs
    restart: always
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs