version: '3.8'

services:
  nextjs:
    image: my-nextjs-app: latest
    container_name: nextjs
    restart: unless-stopped
    expose:
      - "3000"
  
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
