
services:
  nextjs:
    image: my-nextjs-app:latest
    container_name: nextjs
    networks:
      - web

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
    networks:
      - web

networks:
  web:
    name: devopsserver_net
    driver: bridge