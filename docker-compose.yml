services:
  nextjs:
    image: my-nextjs-app:latest
    container_name: nextjs
    restart: always
    ports:
      - "3000:3000"

  nextjs_new:
    image: my-nextjs-app:new
    container_name: nextjs_new
    restart: always
    ports:
      - "3001:3000"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/letsencrypt