name: Deploy Next.js to Kali

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # CRITICAL: This tells GitHub to use your Kali Linux machine
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stop and Remove Old Container
        run: |
          docker stop nextjs-app || true
          docker rm nextjs-app || true

      - name: Build Docker Image
        run: docker build -t nextjs-app .

      - name: Run New Container
        # Maps port 8081 on Kali -> Port 3000 in Next.js Docker container
        run: docker run -d --name nextjs-app -p 8081:3000 nextjs-appCopied!   