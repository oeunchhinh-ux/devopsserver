name: Zero Downtime Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build new image
        run: docker build -t my-nextjs-app:new .

      - name: Run zero-downtime deploy
        run: bash deploy.sh