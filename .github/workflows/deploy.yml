name: Deploy Next.js

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-nextjs-app:latest .

      - name: Save image
        run: docker save my-nextjs-app:latest -o image.tar