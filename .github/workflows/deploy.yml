name: Deploy Next.js to Kali
on:
  push:
    branches: [ "main" ]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Stop Old Container
        run: docker stop nextjs-app || true && docker rm nextjs-app || true
      - name: Build Docker Image
        run: docker build -t nextjs-app .
      - name: Run New Container
        run: docker run -d --name nextjs-app -p 8081:3000 nextjs-app   